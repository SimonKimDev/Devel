apiVersion: apps/v1
kind: Deployment
metadata:
  name: devel-blog-engine
  namespace: devel-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devel-blog-engine
  template:
    metadata:
      labels:
        app: devel-blog-engine
    spec:
      containers:
      - name: devel-blog-engine
        image:  <registry-name>/<image-name>:<tag>
        ports:
        - containerPort: 18080
        resources:
          limits:
            cpu: "0.5"
            memory: "256Mi"
          requests:
            cpu: "0.1"
            memory: "128Mi"
