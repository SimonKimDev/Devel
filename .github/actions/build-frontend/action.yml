name: Build frontend
description: >-
  Installs dependencies and builds the SPA (set build to 'false' to only install, e.g. for
  tests). App-specific build details live here so workflows stay the same when the frontend changes.

inputs:
  api-url:
    description: API origin (no trailing slash) to bake into the bundle. Empty keeps the app's .env defaults.
    required: false
    default: ''
  build:
    description: Set to 'false' to install dependencies without building.
    required: false
    default: 'true'

outputs:
  working-directory:
    description: Frontend project directory.
    value: devel-frontend
  output-dir:
    description: Directory containing the built static site.
    value: devel-frontend/dist

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: devel-frontend/package-lock.json

    - name: Install
      shell: bash
      working-directory: devel-frontend
      run: npm ci --no-audit --no-fund

    - name: Build
      if: inputs.build != 'false'
      shell: bash
      working-directory: devel-frontend
      env:
        API_URL: ${{ inputs.api-url }}
      run: |
        if [[ -n "$API_URL" ]]; then
          # Shell env takes precedence over .env.production in Vite.
          export VITE_API_BASE_URL="${API_URL}/api"
        fi
        npm run build
