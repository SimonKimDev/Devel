name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_DIR: blog-engine
  API_IMAGE_NAME: devel-api
  DEPLOYMENT_NAME: devel-main
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            frontend:
              - 'devel-frontend/**'
              - 'infra/web/**'
              - '.github/actions/build-frontend/**'
              - '.github/workflows/deploy.yml'
            api:
              - 'blog-engine/**'
              - '.github/workflows/deploy.yml'
            infra:
              - 'infra/main.bicep'
              - 'infra/main.bicepparam'
              - 'infra/modules/**'
              - '.github/workflows/deploy.yml'

  # Runs before anything deploys, so a red frontend stops infra and the API from shipping too.
  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-frontend
        id: setup
        with:
          build: 'false'
      - name: Test
        working-directory: ${{ steps.setup.outputs.working-directory }}
        env:
          CI: 'true'
        run: npm test -- --watchAll=false

  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.API_DIR }}/go.mod
          cache-dependency-path: ${{ env.API_DIR }}/go.sum
      - name: Test
        working-directory: ${{ env.API_DIR }}
        run: go test ./...
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/${OWNER,,}/${API_IMAGE_NAME}"
          echo "image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.API_DIR }}
          push: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.latest }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  infra:
    needs: [changes, frontend-test, api-image]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.infra == 'true' || needs.api-image.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve API image
        id: image
        env:
          NEW_IMAGE: ${{ needs.api-image.outputs.image }}
        run: |
          image="$NEW_IMAGE"
          if [[ -z "$image" ]]; then
            # Infra-only change: keep the image the Container App is actually running.
            # Read live state, not deployment outputs: a failed or cancelled deploy has no outputs.
            image=$(az containerapp list -g "$RESOURCE_GROUP" \
              --query '[].properties.template.containers[0].image' -o tsv 2>/dev/null \
              | grep -m1 "^ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${API_IMAGE_NAME}:" || true)
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "API image: ${image:-<placeholder>}"
      - name: Check image is pullable
        if: startsWith(steps.image.outputs.image, 'ghcr.io/')
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # Container Apps pulls anonymously, so the GHCR package must be public.
          repo="${IMAGE#ghcr.io/}"; repo="${repo%:*}"; tag="${IMAGE##*:}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}"; then
            echo "::error::${IMAGE} is not publicly pullable. Set the package visibility to Public: https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${API_IMAGE_NAME}/settings then re-run this job."
            exit 1
          fi
      - name: Deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" \
            -f infra/main.bicep -p infra/main.bicepparam -p apiImage="$IMAGE" \
            --query 'properties.outputs' -o json > outputs.json
          {
            echo "### Deployed"
            echo "- Site: $(jq -r '.siteUrl.value' outputs.json)"
            echo "- API: $(jq -r '.apiUrl.value' outputs.json)"
            echo "- API image: \`${IMAGE:-placeholder}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: [changes, frontend-test, api-image, infra]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read infra outputs
        id: infra
        run: |
          outputs=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query 'properties.outputs' -o json)
          swa=$(jq -r '.staticWebAppName.value' <<< "$outputs")
          token=$(az staticwebapp secrets list -g "$RESOURCE_GROUP" -n "$swa" --query 'properties.apiKey' -o tsv)
          echo "::add-mask::$token"
          echo "api_url=$(jq -r '.apiUrl.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "swa_token=$token" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-frontend
        id: build
        with:
          api-url: ${{ steps.infra.outputs.api_url }}
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ steps.infra.outputs.swa_token }}
          app_location: ${{ steps.build.outputs.output-dir }}
          config_file_location: infra/web
          skip_app_build: true
          skip_api_build: true
          production_branch: main
